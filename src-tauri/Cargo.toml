[package]
name = "rikki"
# The one place the app version is written. `tauri.conf.json` leaves its
# `version` out on purpose, so `tauri-codegen` falls back to `CARGO_PKG_VERSION`
# and the window, the installer filename, the settings row and the updater all
# read this number. `package.json` carries no version either: this crate is not
# published and neither is the npm package, so a second copy could only drift.
version = "1.1.2"
description = "A Spotlight-style desktop launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "rikki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is for the tray: `Image::from_bytes` decodes a PNG at runtime, and
# without the feature it does not exist.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
enigo = "0.3"
active-win-pos-rs = "0.11"
tauri-plugin-clipboard-x = "2.0.2"
tauri-plugin-power-manager = "0.1.1"
reqwest = { version = "0.12", features = ["json"] }
md5 = "0.7"
rand = "0.8"
# Launch at login. The OS holds this state and the plugin is the only thing that
# reads it back, so nothing about it is duplicated in `settings.json` — a second
# copy could only disagree with what the login item actually does.
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = "0.39.6"
system_shutdown = "4"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
icns = "0.3"
# GPU usage on macOS, read out of the accelerator's performance dictionary in the
# I/O registry. The IOKit calls themselves are declared in `sysmon.rs`; this is
# only for reading the CFDictionary they hand back.
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Pinned to the version `tauri` itself resolves, because `PlatformWebview` hands
# back a `webview2_com` type and the two have to be the same type, not two
# identical-looking ones. Bump this whenever `tauri` moves: two versions in the
# graph fail to compile with a message about 2368 `CanInto` impls.
webview2-com = "0.39"
# The `Interface` trait that `cast` comes from, at the version `webview2-com`
# itself uses. `windows`'s own `windows-core` is a different major and its trait
# does not apply to these interfaces, so `ICoreWebView2Settings` cannot be cast
# to `ICoreWebView2Settings4` through it. Bump with `webview2-com`.
windows-core = "0.62"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# MSVC's link.exe prints a localized "正在创建库 <lib> 和对象 <obj>" note every time
# it writes the cdylib import library, and Rust's `linker_messages` lint reports
# that as a warning on every single build. It is not actionable, and `/NOLOGO`
# does not suppress it (Rust already passes /NOLOGO). Allowing the lint is the
# only way to silence it; the trade-off is that genuine linker warnings such as
# LNK4006 or LNK4098 would no longer be shown.
linker_messages = "allow"
